<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRig Pro — Ultimate Hardware Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: rgba(15, 23, 42, 0.8);
            --accent: #22d3ee;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        nav { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px); padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.5rem; text-decoration: none; color: white; }
        .logo span { color: var(--accent); }
        .nav-links a { color: var(--text-dim); text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-left: 20px; cursor: pointer; }
        .nav-links a:hover { color: var(--accent); }

        /* Sections */
        section { padding: 40px 0; display: none; }
        section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Search Hero */
        .search-hero { text-align: center; padding: 60px 0; background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg) 100%); }
        .search-input { width: 100%; max-width: 600px; padding: 18px 30px; border-radius: 50px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; font-size: 1.1rem; outline: none; margin-top: 20px;}

        /* Grid & Cards */
        .grid-main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .hw-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; transition: 0.3s; cursor: pointer; position: relative; }
        .hw-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .tag { font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; display: inline-block; }
        .price { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 2000; padding: 20px; }
        .modal-content { background: #0f172a; max-width: 600px; margin: 50px auto; border-radius: 24px; padding: 40px; border: 1px solid var(--border); position: relative; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--border); }
        
        .btn-action { background: var(--accent); color: black; padding: 15px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<nav>
    <div class="wrap nav-flex">
        <a href="javascript:void(0)" class="logo" onclick="route('home')">GAME<span>RIG</span></a>
        <div class="nav-links">
            <a onclick="route('home')">Database</a>
            <a onclick="route('tracker')">PKR Prices</a>
            <a onclick="route('builder')">Build Gen</a>
            <a onclick="route('checker')">Compatibility</a>
        </div>
    </div>
</nav>

<main class="wrap">
    <!-- DATABASE / SEARCH -->
    <section id="home" class="active">
        <div class="search-hero">
            <h1>Hardware <span style="color:var(--accent)">Database</span></h1>
            <input type="text" class="search-input" id="globalSearch" placeholder="Search GPU or CPU..." onkeyup="searchData()">
        </div>
        <div id="resultsGrid" class="grid-main"></div>
    </section>

    <!-- TRACKER -->
    <section id="tracker">
        <h2>PKR Market Tracker</h2>
        <table>
            <thead>
                <tr><th>Component</th><th>Price</th><th>Condition</th><th>Status</th></tr>
            </thead>
            <tbody id="trackerBody"></tbody>
        </table>
    </section>

    <!-- BUILDER -->
    <section id="builder">
        <h2>AI Build Generator</h2>
        <div class="hw-card" style="max-width: 500px; margin: 20px auto;">
            <select id="budgetSelect" class="search-input" style="margin-top:0">
                <option value="90000">Rs. 90,000</option>
                <option value="175000">Rs. 175,000</option>
                <option value="350000">Rs. 350,000</option>
            </select>
            <button class="btn-action" onclick="generateBuild()">Generate Build</button>
        </div>
        <div id="buildOutput" class="grid-main"></div>
    </section>

    <!-- CHECKER -->
    <section id="checker">
        <h2>Compatibility Checker</h2>
        <div class="grid-main">
            <div class="hw-card">
                <label>CPU</label>
                <select id="cpuS" class="search-input">
                    <option value="AM4">Ryzen 5600 (AM4)</option>
                    <option value="AM5">Ryzen 7600 (AM5)</option>
                </select>
            </div>
            <div class="hw-card">
                <label>Motherboard</label>
                <select id="moboS" class="search-input">
                    <option value="AM4">B550 (AM4)</option>
                    <option value="AM5">B650 (AM5)</option>
                </select>
            </div>
        </div>
        <button class="btn-action" onclick="checkComp()">Run Check</button>
        <div id="cStatus" style="margin-top:20px; text-align:center; font-weight:800; padding:20px; border-radius:12px; display:none;"></div>
    </section>
</main>

<!-- MODAL -->
<div id="hwModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // --- DATA ---
    const db = [
        { name: "RTX 4060", price: 96000, type: "GPU", cond: "New", detail: "Best for 1080p Ultra gaming. Low power draw." },
        { name: "RTX 3060", price: 78000, type: "GPU", cond: "Used", detail: "12GB VRAM makes this great for productivity and gaming." },
        { name: "RX 6600", price: 58000, type: "GPU", cond: "Used", detail: "Best value for money in the used market." },
        { name: "Ryzen 5 5600", price: 28500, type: "CPU", cond: "New", detail: "The AM4 king for budget builds." },
        { name: "Core i5 12400F", price: 34000, type: "CPU", cond: "New", detail: "Strong gaming performance on LGA1700." }
    ];

    // --- NAVIGATION ---
    function route(id) {
        const sections = document.querySelectorAll('section');
        sections.forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if(id === 'tracker') renderTracker();
    }

    // --- SEARCH & RENDER ---
    function searchData() {
        const q = document.getElementById('globalSearch').value.toLowerCase();
        const filtered = db.filter(item => item.name.toLowerCase().includes(q));
        renderCards(filtered);
    }

    function renderCards(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = data.map(item => `
            <div class="hw-card" onclick="openModal('${item.name}')">
                <span class="tag" style="background:rgba(34,211,238,0.1); color:#22d3ee">${item.cond}</span>
                <h3>${item.name}</h3>
                <p class="price">Rs. ${item.price.toLocaleString()}</p>
                <p style="font-size:0.8rem; color:#94a3b8; margin-top:10px">Click for details →</p>
            </div>
        `).join('');
    }

    // --- TRACKER ---
    function renderTracker() {
        const t = document.getElementById('trackerBody');
        t.innerHTML = db.map(item => `
            <tr>
                <td><b>${item.name}</b></td>
                <td>Rs. ${item.price.toLocaleString()}</td>
                <td>${item.cond}</td>
                <td style="color:#10b981">Live</td>
            </tr>
        `).join('');
    }

    // --- MODAL ---
    function openModal(name) {
        const item = db.find(i => i.name === name);
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <h2>${item.name}</h2>
            <p style="color:#22d3ee; font-size:1.5rem; margin:10px 0">Rs. ${item.price.toLocaleString()}</p>
            <p style="margin:20px 0">${item.detail}</p>
            <div class="tag" style="background:#22d3ee; color:black; width:100%; text-align:center; padding:10px">Market Rating: High Value</div>
        `;
        document.getElementById('hwModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('hwModal').style.display = 'none';
    }

    // --- BUILDER ---
    function generateBuild() {
        const b = document.getElementById('budgetSelect').value;
        const out = document.getElementById('buildOutput');
        const parts = b == "90000" ? ["Ryzen 3600", "GTX 1660S", "16GB RAM"] : ["i5 12400F", "RTX 4060", "16GB DDR4"];
        out.innerHTML = parts.map(p => `<div class="hw-card"><h3>${p}</h3></div>`).join('');
    }

    // --- CHECKER ---
    function checkComp() {
        const c = document.getElementById('cpuS').value;
        const m = document.getElementById('moboS').value;
        const res = document.getElementById('cStatus');
        res.style.display = 'block';
        if(c === m) {
            res.style.background = 'rgba(16,185,129,0.1)';
            res.style.color = '#10b981';
            res.innerText = "✓ COMPATIBLE";
        } else {
            res.style.background = 'rgba(239,68,68,0.1)';
            res.style.color = '#ef4444';
            res.innerText = "❌ INCOMPATIBLE SOCKETS";
        }
    }

    // Initialize
    window.onload = () => {
        renderCards(db);
    };
</script>

</body>
</html>
