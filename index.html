<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRig Pro — NVIDIA & AMD Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: rgba(15, 23, 42, 0.8);
            --accent: #22d3ee;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
            --dropdown-bg: #0f172a; /* Dark background for dropdowns */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        nav { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px); padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.5rem; text-decoration: none; color: white; }
        .logo span { color: var(--accent); }
        .nav-links a { color: var(--text-dim); text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-left: 20px; cursor: pointer; }
        .nav-links a:hover { color: var(--accent); }

        /* Sections */
        section { padding: 40px 0; display: none; }
        section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Search Hero */
        .search-hero { text-align: center; padding: 60px 0; background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg) 100%); border-radius: 30px; margin-top: 20px;}
        
        /* DROPDOWN & INPUT FIX */
        .search-input { 
            width: 100%; 
            max-width: 600px; 
            padding: 18px 30px; 
            border-radius: 50px; 
            background: var(--dropdown-bg); 
            border: 1px solid var(--border); 
            color: white; 
            font-size: 1.1rem; 
            outline: none; 
            margin-top: 20px;
            appearance: none; /* Modern look */
        }

        /* Essential Fix for unreadable white dropdowns */
        select.search-input option {
            background-color: var(--dropdown-bg);
            color: white;
            padding: 10px;
        }
        select.search-input optgroup {
            background-color: #1e293b;
            color: var(--accent);
            font-style: normal;
            font-weight: 700;
        }

        /* Grid & Cards */
        .grid-main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .hw-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; transition: 0.3s; cursor: pointer; position: relative; }
        .hw-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .tag { font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; display: inline-block; }
        .price { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 2000; padding: 20px; }
        .modal-content { background: #0f172a; max-width: 600px; margin: 50px auto; border-radius: 24px; padding: 40px; border: 1px solid var(--border); position: relative; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; }

        .btn-action { background: var(--accent); color: black; padding: 15px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<nav>
    <div class="wrap nav-flex">
        <a href="javascript:void(0)" class="logo" onclick="route('home')">GAME<span>RIG</span></a>
        <div class="nav-links">
            <a onclick="route('home')">GPU Database</a>
            <a onclick="route('checker')">Compatibility</a>
            <a onclick="route('tracker')">Market Prices</a>
        </div>
    </div>
</nav>

<main class="wrap">
    <section id="home" class="active">
        <div class="search-hero">
            <h1>NVIDIA & AMD <span style="color:var(--accent)">Database</span></h1>
            <p style="color:var(--text-dim)">Search 60+ Graphics Cards with PKR Estimates</p>
            <input type="text" class="search-input" id="globalSearch" placeholder="Search (e.g. RX 7800 XT, 3060, 580)..." onkeyup="searchData()">
        </div>
        <div id="resultsGrid" class="grid-main"></div>
    </section>

    <section id="checker">
        <h2 style="text-align:center; font-size:2.5rem">Compatibility <span style="color:var(--accent)">Checker</span></h2>
        <div class="grid-main">
            <div class="hw-card">
                <label style="font-weight:700; color:var(--accent)">Select CPU</label>
                <select id="cpuS" class="search-input" style="margin-top:10px; border-radius: 12px;">
                    <optgroup label="AMD">
                        <option value="AM5">Ryzen 9000/7000 (AM5)</option>
                        <option value="AM4">Ryzen 5000/3000 (AM4)</option>
                    </optgroup>
                    <optgroup label="Intel">
                        <option value="1851">Core Ultra 200 (LGA 1851)</option>
                        <option value="1700">Core 14/13/12th Gen (LGA 1700)</option>
                        <option value="1200">Core 11/10th Gen (LGA 1200)</option>
                    </optgroup>
                </select>
            </div>
            <div class="hw-card">
                <label style="font-weight:700; color:var(--accent)">Select Motherboard</label>
                <select id="moboS" class="search-input" style="margin-top:10px; border-radius: 12px;">
                    <optgroup label="AMD Boards">
                        <option value="AM5">B650 / X670 (AM5)</option>
                        <option value="AM4">B550 / B450 / A520 (AM4)</option>
                    </optgroup>
                    <optgroup label="Intel Boards">
                        <option value="1851">Z890 (LGA 1851)</option>
                        <option value="1700">Z790 / B760 / B660 (LGA 1700)</option>
                        <option value="1200">Z590 / B560 / Z490 (LGA 1200)</option>
                    </optgroup>
                </select>
            </div>
        </div>
        <button class="btn-action" onclick="checkComp()">Validate Socket Match</button>
        <div id="cStatus" style="margin-top:20px; text-align:center; font-weight:800; padding:25px; border-radius:15px; display:none;"></div>
    </section>

    <section id="tracker">
        <h2 style="margin-bottom:20px">Market Price <span style="color:var(--accent)">Tracker</span></h2>
        <div style="background:var(--card); padding:20px; border-radius:20px; border:1px solid var(--border)">
            <table style="width:100%">
                <thead style="color:var(--accent)">
                    <tr><th>Model</th><th>Estimated Price</th><th>Condition</th></tr>
                </thead>
                <tbody id="trackerBody"></tbody>
            </table>
        </div>
    </section>
</main>

<div id="hwModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const db = [
        // --- AMD RADEON ---
        { name: "RX 7900 XTX", price: 345000, type: "GPU", cond: "New", detail: "24GB VRAM. AMD's flagship. Incredible rasterization performance." },
        { name: "RX 7900 XT", price: 285000, type: "GPU", cond: "New", detail: "20GB VRAM. A beast for 4K gaming." },
        { name: "RX 7800 XT", price: 165000, type: "GPU", cond: "New", detail: "The current 1440p king of value." },
        { name: "RX 7700 XT", price: 138000, type: "GPU", cond: "New", detail: "Strong mid-range performance with 12GB VRAM." },
        { name: "RX 7600", price: 88000, type: "GPU", cond: "New", detail: "Solid 1080p gaming with modern architecture." },
        { name: "RX 6950 XT", price: 185000, type: "GPU", cond: "Used", detail: "Top tier performance from the previous generation." },
        { name: "RX 6800 XT", price: 135000, type: "GPU", cond: "Used", detail: "Highly sought after for 1440p high-refresh gaming." },
        { name: "RX 6700 XT", price: 95000, type: "GPU", cond: "Used", detail: "12GB VRAM. Best mid-range used card in Pakistan." },
        { name: "RX 6600 XT", price: 78000, type: "GPU", cond: "Used", detail: "Efficient and powerful 1080p card." },
        { name: "RX 6600", price: 62000, type: "GPU", cond: "Used", detail: "Unbeatable value for budget 1080p builds." },
        { name: "RX 5700 XT", price: 55000, type: "GPU", cond: "Used", detail: "Still very capable for 1080p Ultra." },
        { name: "RX 580 8GB", price: 25000, type: "GPU", cond: "Used", detail: "The budget legendary card for casual gaming." },

        // --- NVIDIA RTX ---
        { name: "RTX 5090", price: 650000, type: "GPU", cond: "Pre-Order", detail: "Blackwell Architecture. 32GB VRAM. Beyond gaming." },
        { name: "RTX 4090", price: 580000, type: "GPU", cond: "New", detail: "Current NVIDIA king. Best for content creation and 4K." },
        { name: "RTX 4070 Super", price: 188000, type: "GPU", cond: "New", detail: "High efficiency, excellent frame generation." },
        { name: "RTX 4060", price: 96000, type: "GPU", cond: "New", detail: "Most efficient card for modern 1080p." },
        { name: "RTX 3090", price: 245000, type: "GPU", cond: "Used", detail: "24GB VRAM. Great for AI and rendering work." },
        { name: "RTX 3070", price: 105000, type: "GPU", cond: "Used", detail: "Solid 1440p gaming card." },
        { name: "RTX 3060 12GB", price: 82000, type: "GPU", cond: "Used", detail: "Most popular choice for gamers in Pakistan." },
        { name: "RTX 2060 Super", price: 68000, type: "GPU", cond: "Used", detail: "8GB VRAM and DLSS support." },
        { name: "GTX 1080 Ti", price: 75000, type: "GPU", cond: "Used", detail: "The 11GB legend. Still solid today." },
        { name: "GTX 1060 6GB", price: 32000, type: "GPU", cond: "Used", detail: "Reliable 1080p performance for cheap." }
    ];

    function route(id) {
        document.querySelectorAll('section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if(id === 'tracker') renderTracker();
        window.scrollTo(0,0);
    }

    function searchData() {
        const q = document.getElementById('globalSearch').value.toLowerCase();
        const filtered = db.filter(item => item.name.toLowerCase().includes(q));
        renderCards(filtered);
    }

    function renderCards(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = data.map(item => `
            <div class="hw-card" onclick="openModal('${item.name}')">
                <span class="tag" style="background:rgba(34,211,238,0.1); color:#22d3ee">${item.cond}</span>
                <h3>${item.name}</h3>
                <p class="price">Rs. ${item.price.toLocaleString()}</p>
            </div>
        `).join('');
    }

    function renderTracker() {
        const t = document.getElementById('trackerBody');
        t.innerHTML = db.map(item => `
            <tr style="border-bottom:1px solid rgba(255,255,255,0.05)">
                <td style="padding:15px"><b>${item.name}</b></td>
                <td>Rs. ${item.price.toLocaleString()}</td>
                <td><span style="color:#22d3ee">${item.cond}</span></td>
            </tr>
        `).join('');
    }

    function openModal(name) {
        const item = db.find(i => i.name === name);
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <div class="tag" style="background:#22d3ee; color:black">${item.cond}</div>
            <h2 style="font-size:2rem; margin:10px 0">${item.name}</h2>
            <p style="color:#22d3ee; font-size:1.8rem; font-weight:800; margin-bottom:20px">Rs. ${item.price.toLocaleString()}</p>
            <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:12px">
                <h4 style="margin-bottom:10px; color:#22d3ee">Specs & Info</h4>
                <p>${item.detail}</p>
            </div>
            <button class="btn-action" onclick="closeModal()">Close</button>
        `;
        document.getElementById('hwModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('hwModal').style.display = 'none';
    }

    function checkComp() {
        const c = document.getElementById('cpuS').value;
        const m = document.getElementById('moboS').value;
        const res = document.getElementById('cStatus');
        res.style.display = 'block';
        if(c === m) {
            res.style.background = 'rgba(16,185,129,0.15)';
            res.style.color = '#10b981';
            res.innerHTML = "✓ PERFECT MATCH: Socket " + c + " detected.";
        } else {
            res.style.background = 'rgba(239,68,68,0.15)';
            res.style.color = '#ef4444';
            res.innerHTML = "❌ INCOMPATIBLE: " + c + " CPU cannot fit in " + m + " board.";
        }
    }

    window.onload = () => { renderCards(db); };
</script>

</body>
</html>
