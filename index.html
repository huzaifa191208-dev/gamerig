<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRig — The Ultimate Hardware Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.7);
            --accent: #22d3ee;
            --text: #f8fafc;
            --text-dim: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --nvidia: #76b900;
            --amd: #ed1c24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        /* Navigation */
        nav { background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(12px); padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.5rem; text-decoration: none; color: white; letter-spacing: -1px; }
        .logo span { color: var(--accent); }

        /* Hero / Search */
        .hero { padding: 80px 0 40px; text-align: center; background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%); }
        .search-container { position: relative; max-width: 700px; margin: 30px auto 0; }
        .search-bar { width: 100%; padding: 20px 30px; border-radius: 50px; background: #0f172a; border: 1px solid var(--border); color: white; font-size: 1.1rem; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 25px rgba(34, 211, 238, 0.15); }

        /* Grid Layout */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 40px; }
        @media (max-width: 992px) { .dashboard-grid { grid-template-columns: 1fr; } }

        h2 { font-size: 1.8rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        h2::before { content: ''; width: 4px; height: 24px; background: var(--accent); border-radius: 2px; }

        /* GPU Cards */
        .gpu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; transition: 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); background: #111827; }
        .brand-line { height: 3px; width: 40px; border-radius: 2px; margin-bottom: 12px; }
        .brand-nvidia { background: var(--nvidia); }
        .brand-amd { background: var(--amd); }
        .price { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .condition { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; color: var(--text-dim); }

        /* Sidebar Tools */
        .tool-box { background: #0f172a; border: 1px solid var(--border); border-radius: 24px; padding: 25px; position: sticky; top: 100px; height: fit-content; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
        select { width: 100%; padding: 12px; border-radius: 12px; background: #1e293b; border: 1px solid var(--border); color: white; font-size: 0.9rem; outline: none; }
        select option { background: #0f172a; }

        .btn { width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: black; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        #comp-result { margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: 700; text-align: center; display: none; font-size: 0.85rem; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 2000; padding: 20px; }
        .modal-content { background: #0f172a; max-width: 500px; margin: 80px auto; border-radius: 24px; padding: 40px; border: 1px solid var(--border); position: relative; }
    </style>
</head>
<body>

<nav>
    <div class="wrap nav-flex">
        <a href="#" class="logo">GAME<span>RIG</span></a>
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-dim);">PAKISTANI HARDWARE HUB</div>
    </div>
</nav>

<section class="hero">
    <div class="wrap">
        <h1>Find Your <span style="color:var(--accent)">Ideal Upgrade.</span></h1>
        <div class="search-container">
            <input type="text" id="mainSearch" class="search-bar" placeholder="Search any GPU (e.g. 3060, RX 580, 5090)..." onkeyup="filterCards()">
        </div>
    </div>
</section>

<main class="wrap">
    <div class="dashboard-grid">
        
        <!-- LEFT: GPU SHUFFLE GRID -->
        <div class="content-area">
            <h2>Hardware Database</h2>
            <div id="gpuContainer" class="gpu-grid"></div>
        </div>

        <!-- RIGHT: SIDEBAR TOOLS -->
        <div class="sidebar">
            <div class="tool-box">
                <h2>Quick Checker</h2>
                <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px;">Instantly verify if your CPU & Motherboard match.</p>
                
                <div class="input-group">
                    <label>Select CPU</label>
                    <select id="cpuS">
                        <optgroup label="Modern AMD">
                            <option value="AM5">Ryzen 9000/7000 (AM5)</option>
                            <option value="AM4">Ryzen 5000/3000/2000 (AM4)</option>
                        </optgroup>
                        <optgroup label="Older AMD">
                            <option value="AM3">FX Series / Phenom (AM3+)</option>
                            <option value="FM2">A-Series APUs (FM2+)</option>
                        </optgroup>
                        <optgroup label="Modern Intel">
                            <option value="1700">Core 12th/13th/14th Gen (LGA 1700)</option>
                            <option value="1200">Core 10th/11th Gen (LGA 1200)</option>
                        </optgroup>
                        <optgroup label="Mid/Legacy Intel">
                            <option value="1151">Core 6th/7th/8th/9th Gen (LGA 1151)</option>
                            <option value="1155">Core 2nd/3rd Gen (LGA 1155)</option>
                            <option value="775">Core 2 Duo/Quad (LGA 775)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="input-group">
                    <label>Select Motherboard</label>
                    <select id="moboS">
                        <optgroup label="AMD Boards">
                            <option value="AM5">B650 / X670 (AM5)</option>
                            <option value="AM4">B550 / B450 / A320 (AM4)</option>
                            <option value="AM3">990FX / 970 / 760G (AM3+)</option>
                        </optgroup>
                        <optgroup label="Intel Boards">
                            <option value="1700">Z790 / B760 / H610 (LGA 1700)</option>
                            <option value="1200">Z590 / B560 / H410 (LGA 1200)</option>
                            <option value="1151">Z390 / B360 / H110 (LGA 1151)</option>
                            <option value="1155">Z77 / H61 (LGA 1155)</option>
                            <option value="775">G41 / G31 / P45 (LGA 775)</option>
                        </optgroup>
                    </select>
                </div>

                <button class="btn" onclick="checkCompatibility()">Validate Match</button>
                <div id="comp-result"></div>
            </div>
        </div>

    </div>
</main>

<!-- SIMPLE MODAL -->
<div id="hwModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName"></h2>
        <div id="mPrice" class="price" style="font-size: 2rem;"></div>
        <p id="mDesc" style="margin: 20px 0; color: var(--text-dim);"></p>
        <button class="btn" onclick="closeModal()">Back to Dashboard</button>
    </div>
</div>

<script>
    const db = [
        // MIXED NVIDIA & AMD
        { n: "RTX 5090", p: 650000, b: "nvidia", c: "Pre-order", d: "Next-gen Blackwell titan. 32GB VRAM." },
        { n: "RX 7900 XTX", p: 345000, b: "amd", c: "New", d: "24GB VRAM. AMD's current rasterization king." },
        { n: "RTX 4090", p: 585000, b: "nvidia", c: "New", d: "The ultimate 4K and AI workstation card." },
        { n: "RX 7800 XT", p: 165000, b: "amd", c: "New", d: "The 1440p value champion. Great VRAM." },
        { n: "RTX 3060 12GB", p: 82000, b: "nvidia", c: "Used", d: "Most popular GPU in Pakistan. Huge VRAM for price." },
        { n: "RX 6700 XT", p: 92000, b: "amd", c: "Used", d: "Excellent mid-range used card with 12GB memory." },
        { n: "RTX 4060", p: 96000, b: "nvidia", c: "New", d: "The efficiency king. Great for 1080p Ultra." },
        { n: "RX 6600", p: 62000, b: "amd", c: "Used", d: "Unbeatable budget 1080p card." },
        { n: "GTX 1080 Ti", p: 75000, b: "nvidia", c: "Used", d: "The 11GB legend. Still solid for 1440p." },
        { n: "RX 580 8GB", p: 25000, b: "amd", c: "Used", d: "The king of budget gaming in Pakistan." },
        { n: "RTX 2060 Super", p: 68000, b: "nvidia", c: "Used", d: "Great used mid-range card with DLSS support." },
        { n: "RX 5700 XT", p: 55000, b: "amd", c: "Used", d: "Strong 1080p performance, competes with RTX 3060." },
        { n: "GTX 1660 Super", p: 48000, b: "nvidia", c: "Used", d: "Solid 1080p card for competitive games." },
        { n: "RX 6800 XT", p: 135000, b: "amd", c: "Used", d: "High-end 1440p performer with 16GB VRAM." },
        { n: "RTX 3070", p: 105000, b: "nvidia", c: "Used", d: "Perfect for high-refresh 1080p or 1440p." },
        { n: "GTX 1060 6GB", p: 32000, b: "nvidia", c: "Used", d: "Reliable 1080p performance for budget builds." }
    ];

    // SHUFFLE FUNCTION
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function renderCards(data) {
        const container = document.getElementById('gpuContainer');
        container.innerHTML = data.map(item => `
            <div class="card" onclick="openModal('${item.n}')">
                <div class="brand-line brand-${item.b}"></div>
                <span class="condition">${item.c}</span>
                <h3 style="margin-top:5px">${item.n}</h3>
                <div class="price">Rs. ${item.p.toLocaleString()}</div>
                <div style="font-size:0.75rem; color:var(--text-dim)">${item.b.toUpperCase()} Architecture</div>
            </div>
        `).join('');
    }

    function filterCards() {
        const q = document.getElementById('mainSearch').value.toLowerCase();
        const filtered = db.filter(i => i.n.toLowerCase().includes(q));
        renderCards(filtered);
    }

    function openModal(name) {
        const item = db.find(i => i.n === name);
        document.getElementById('mName').innerText = item.n;
        document.getElementById('mPrice').innerText = "Rs. " + item.p.toLocaleString();
        document.getElementById('mDesc').innerText = item.d;
        document.getElementById('hwModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('hwModal').style.display = 'none';
    }

    function checkCompatibility() {
        const cpu = document.getElementById('cpuS').value;
        const mobo = document.getElementById('moboS').value;
        const res = document.getElementById('comp-result');
        res.style.display = 'block';
        if(cpu === mobo) {
            res.style.background = 'rgba(16,185,129,0.1)';
            res.style.color = '#10b981';
            res.innerText = "✓ COMPATIBLE: Sockets match.";
        } else {
            res.style.background = 'rgba(239,68,68,0.1)';
            res.style.color = '#ef4444';
            res.innerText = "❌ INCOMPATIBLE: Socket mismatch.";
        }
    }

    window.onload = () => {
        shuffleArray(db); // Shuffle on load
        renderCards(db);
    };
</script>

</body>
</html>
