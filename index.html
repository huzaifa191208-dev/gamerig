<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRig — Pro Hardware Intelligence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: rgba(15, 23, 42, 0.8);
            --accent: #22d3ee;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --nvidia: #76b900;
            --amd: #ed1c24;
            --intel: #0071c5;
            --great-deal: #10b981;
            --overpriced: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        nav { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px); padding: 20px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.6rem; text-decoration: none; color: white; letter-spacing: -1.5px; }
        .logo span { color: var(--accent); }

        /* Legend & Search */
        .search-section { padding: 40px 0; text-align: center; background: radial-gradient(circle at top, #1e1b4b, var(--bg)); }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 0.75rem; font-weight: 700; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        .search-bar { width: 90%; max-width: 700px; padding: 18px 30px; border-radius: 50px; background: #0f172a; border: 1px solid var(--border); color: white; font-size: 1.1rem; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(34, 211, 238, 0.2); }

        /* Dashboard Layout */
        .dashboard { display: grid; grid-template-columns: 1fr 400px; gap: 30px; margin-top: 30px; padding-bottom: 80px; }
        @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } }

        /* Sidebar Tools */
        .sidebar { position: sticky; top: 100px; height: fit-content; display: flex; flex-direction: column; gap: 20px; }
        .tool-card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; }
        .tool-card h3 { font-size: 0.9rem; margin-bottom: 15px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        /* Modernized Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { 
            background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; 
            transition: 0.3s; cursor: pointer; position: relative; border-top: 4px solid #334155;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card.nvidia { border-top-color: var(--nvidia); }
        .card.amd { border-top-color: var(--amd); }
        .card.intel { border-top-color: var(--intel); }

        .price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
        .price { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
        .v-score { font-size: 0.7rem; font-weight: 800; background: #1e293b; padding: 4px 8px; border-radius: 5px; }

        .deal-tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: block; }

        /* Tool Inputs */
        select, button { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-top: 10px; font-weight: 700; }
        select { background: #1e293b; color: white; cursor: pointer; }
        .btn { background: var(--accent); color: #000; border: none; cursor: pointer; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); transform: scale(1.02); }
        .result-panel { margin-top: 20px; padding: 20px; border-radius: 15px; background: rgba(0,0,0,0.3); font-size: 0.9rem; display: none; }

        /* Modal / Deep Detail */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 2000; overflow-y: auto; }
        .modal-content { background: #0f172a; max-width: 650px; margin: 60px auto; border-radius: 30px; padding: 45px; border: 1px solid var(--border); position: relative; }
        .close-btn { position: absolute; top: 25px; right: 25px; font-size: 1.5rem; cursor: pointer; }

        .spec-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .trend-box { margin-top: 20px; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.03); }

        .compare-bar { background: var(--accent); height: 8px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

<nav>
    <div class="wrap nav-flex">
        <a href="#" class="logo" onclick="location.reload()">GAME<span>RIG</span></a>
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-dim); letter-spacing: 1px;">MARKET INTELLIGENCE v3.0</div>
    </div>
</nav>

<section class="search-section">
    <div class="wrap">
        <input type="text" id="search" class="search-bar" placeholder="Universal Search: GPUs, CPUs, or Tiers (e.g. 3060, i5, 4k)..." onkeyup="filterData()">
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:var(--nvidia)"></div> NVIDIA</div>
            <div class="legend-item"><div class="dot" style="background:var(--amd)"></div> AMD</div>
            <div class="legend-item"><div class="dot" style="background:var(--intel)"></div> Intel</div>
            <div class="legend-item"><span style="color:var(--text-dim); margin-left:10px;">Updated: Today, 9:00 PM (PKT)</span></div>
        </div>
    </div>
</section>

<main class="wrap dashboard">
    
    <!-- LEFT COLUMN: HARDWARE DATABASE -->
    <div class="main-feed">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 1.4rem;">Market Live Feed</h2>
            <div style="font-size: 0.8rem; color:var(--text-dim)">Click any card for specs & trends</div>
        </div>
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT COLUMN: TOOLS & ANALYTICS -->
    <div class="sidebar">
        
        <!-- COMPARISON TOOL -->
        <div class="tool-card">
            <h3>GPU/CPU Compare</h3>
            <select id="compA"></select>
            <select id="compB"></select>
            <button class="btn" onclick="compareItems()">Compare Performance</button>
            <div id="compRes" class="result-panel"></div>
        </div>

        <!-- FPS ESTIMATOR -->
        <div class="tool-card">
            <h3>FPS Estimator (1080p)</h3>
            <select id="fpsGpuSelect"></select>
            <select id="fpsGame" style="margin-top: 10px;">
                <option value="2.5">Valorant (Low/Comp)</option>
                <option value="1.5">Warzone 3 (Competitive)</option>
                <option value="0.9">Cyberpunk 2077 (Ultra)</option>
            </select>
            <button class="btn" onclick="estimateFPS()">Run Benchmark</button>
            <div id="fpsRes" class="result-panel" style="text-align: center;">
                <span id="fpsValue" style="font-size: 2.5rem; font-weight: 800; color: var(--accent);">0</span><br>ESTIMATED FPS
            </div>
        </div>

        <!-- BUILD GENERATOR -->
        <div class="tool-card">
            <h3>PKR Build Generator</h3>
            <select id="budgetTier">
                <option value="90000">Rs. 90,000 (Budget King)</option>
                <option value="180000" selected>Rs. 180,000 (1440p King)</option>
                <option value="350000">Rs. 350,000 (4K Extreme)</option>
            </select>
            <button class="btn" onclick="generateBuild()">Generate System</button>
            <div id="buildRes" class="result-panel"></div>
        </div>

    </div>
</main>

<!-- MODAL: DEEP SPECS -->
<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<script>
// --- EXTENDED DATABASE ---
const database = [
    // GPUs
    { name: "RTX 5090", brand: "nvidia", price: 650000, condition: "Pre-order", type: "GPU", vScore: 7, power: "600W", vram: "32GB", score: 100, trend: "Static", deal: "New Tech" },
    { name: "RTX 4090", brand: "nvidia", price: 585000, condition: "New", type: "GPU", vScore: 6, power: "450W", vram: "24GB", score: 95, trend: "Up", deal: "Overpriced" },
    { name: "RTX 4070 Super", brand: "nvidia", price: 188000, condition: "New", type: "GPU", vScore: 9, power: "220W", vram: "12GB", score: 75, trend: "Down", deal: "Great Deal" },
    { name: "RTX 3060 12GB", brand: "nvidia", price: 82000, condition: "Used", type: "GPU", vScore: 10, power: "170W", vram: "12GB", score: 55, trend: "Down", deal: "Best Value" },
    { name: "RX 7900 XTX", brand: "amd", price: 345000, condition: "New", type: "GPU", vScore: 8, power: "355W", vram: "24GB", score: 92, trend: "Static", deal: "Fair Price" },
    { name: "RX 6700 XT", brand: "amd", price: 94000, condition: "Used", type: "GPU", vScore: 10, power: "230W", vram: "12GB", score: 65, trend: "Down", deal: "Great Deal" },
    { name: "RX 580 8GB", brand: "amd", price: 25500, condition: "Used", type: "GPU", vScore: 9, power: "185W", vram: "8GB", score: 25, trend: "Static", deal: "Budget King" },
    
    // CPUs
    { name: "Core i5 12400F", brand: "intel", price: 34000, condition: "New", type: "CPU", vScore: 10, socket: "LGA1700", cores: "6/12", score: 60, trend: "Static", deal: "Great Deal" },
    { name: "Ryzen 5 7600", brand: "amd", price: 58000, condition: "New", type: "CPU", vScore: 9, socket: "AM5", cores: "6/12", score: 70, trend: "Down", deal: "Fair Price" },
    { name: "Ryzen 7 7800X3D", brand: "amd", price: 115000, brand: "amd", price: 115000, condition: "New", type: "CPU", vScore: 8, socket: "AM5", cores: "8/16", score: 95, trend: "Up", deal: "Overpriced" },
    { name: "Core i9 14900K", brand: "intel", price: 185000, condition: "New", type: "CPU", vScore: 7, socket: "LGA1700", cores: "24/32", score: 98, trend: "Static", deal: "High End" }
];

// --- RENDER FUNCTIONS ---
function renderGrid(data) {
    const grid = document.getElementById('grid');
    grid.innerHTML = data.map(item => `
        <div class="card ${item.brand}" onclick="openDetail('${item.name}')">
            <span class="deal-tag" style="color:${getDealColor(item.deal)}">${item.deal}</span>
            <span class="tag">${item.condition}</span>
            <h3 style="margin-top:5px; font-size:1.1rem;">${item.name}</h3>
            <div class="price-row">
                <div class="price">Rs. ${item.price.toLocaleString()}</div>
                <div class="v-score">V-Score: ${item.vScore}/10</div>
            </div>
            <div style="font-size:0.7rem; color:var(--text-dim); margin-top:10px; display:flex; justify-content:space-between;">
                <span>${item.type}</span>
                <span>Trend: ${item.trend === 'Down' ? '▼' : item.trend === 'Up' ? '▲' : '▬'}</span>
            </div>
        </div>
    `).join('');
}

function getDealColor(deal) {
    if(deal === 'Great Deal' || deal === 'Best Value' || deal === 'Budget King') return 'var(--great-deal)';
    if(deal === 'Overpriced') return 'var(--overpriced)';
    return 'var(--text-dim)';
}

// --- TOOLS LOGIC ---
function filterData() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = database.filter(x => x.name.toLowerCase().includes(q) || x.type.toLowerCase().includes(q));
    renderGrid(filtered);
}

function estimateFPS() {
    const gpuName = document.getElementById('fpsGpuSelect').value;
    const gameMult = document.getElementById('fpsGame').value;
    const gpu = database.find(x => x.name === gpuName);
    const result = Math.round(gpu.score * 2.5 * gameMult);
    
    document.getElementById('fpsRes').style.display = 'block';
    document.getElementById('fpsValue').innerText = result;
}

function generateBuild() {
    const budget = parseInt(document.getElementById('budgetTier').value);
    const buildRes = document.getElementById('buildRes');
    buildRes.style.display = 'block';
    
    let cpu, gpu;
    if(budget === 90000) { cpu = "Ryzen 5 3600"; gpu = "RX 580 8GB"; }
    else if(budget === 180000) { cpu = "Core i5 12400F"; gpu = "RTX 4060"; }
    else { cpu = "Ryzen 7 7800X3D"; gpu = "RTX 4080 Super"; }

    buildRes.innerHTML = `
        <b>Recommended Combo:</b><br>
        CPU: ${cpu}<br>GPU: ${gpu}<br>
        <span style="color:var(--great-deal); font-size:0.75rem;">✓ Compatibility Verified (Socket & Bottleneck)</span>
    `;
}

function compareItems() {
    const nameA = document.getElementById('compA').value;
    const nameB = document.getElementById('compB').value;
    const itemA = database.find(x => x.name === nameA);
    const itemB = database.find(x => x.name === nameB);
    
    const panel = document.getElementById('compRes');
    panel.style.display = 'block';
    panel.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>${itemA.name}</span> <span>VS</span> <span>${itemB.name}</span>
        </div>
        <div style="font-size:0.8rem;">
            Power: ${itemA.power || itemA.socket} vs ${itemB.power || itemB.socket}<br>
            Value: ${itemA.vScore}/10 vs ${itemB.vScore}/10
        </div>
        <div class="compare-bar" style="width:${(itemA.score/(itemA.score+itemB.score))*100}%"></div>
    `;
}

// --- MODAL LOGIC ---
function openDetail(name) {
    const item = database.find(x => x.name === name);
    const modal = document.getElementById('modal');
    const content = document.getElementById('modalContent');
    
    content.innerHTML = `
        <h2 style="font-size:2rem; margin-bottom:5px;">${item.name}</h2>
        <div style="color:var(--accent); font-weight:800; font-size:1.5rem; margin-bottom:20px;">Rs. ${item.price.toLocaleString()}</div>
        
        <div class="trend-box">
            <span style="font-weight:800;">Deal Status: <span style="color:${getDealColor(item.deal)}">${item.deal}</span></span>
            <p style="font-size:0.8rem; color:var(--text-dim); margin-top:5px;">Trend: The price for this item has been ${item.trend.toLowerCase()} over the last 30 days.</p>
        </div>

        <div style="margin-top:30px;">
            <h3>Hardware Specs</h3>
            <div class="spec-item"><span>Performance Rank</span> <span>${item.score}/100</span></div>
            <div class="spec-item"><span>VRAM / Cores</span> <span>${item.vram || item.cores}</span></div>
            <div class="spec-item"><span>Power / Socket</span> <span>${item.power || item.socket}</span></div>
            <div class="spec-item"><span>Value Score</span> <span>${item.vScore} / 10</span></div>
        </div>

        <div style="margin-top:30px; font-size:0.8rem; color:var(--text-dim);">
            *Last Updated: Today • Market: Pakistan (Used/New Mix)
        </div>
    `;
    modal.style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

// --- INITIALIZATION ---
window.onload = () => {
    // Populate Tool Selects
    const gpuOnly = database.filter(x => x.type === 'GPU');
    const allNames = database.map(x => x.name);
    
    const fillSelect = (id, list) => {
        const select = document.getElementById(id);
        list.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.innerText = name;
            select.appendChild(opt);
        });
    }

    fillSelect('compA', allNames);
    fillSelect('compB', allNames);
    fillSelect('fpsGpuSelect', gpuOnly.map(x => x.name));
    
    renderGrid(database);
};
</script>

</body>
</html>
