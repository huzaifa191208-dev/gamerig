<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRig Hub — Complete Hardware Database & Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: rgba(15, 23, 42, 0.8);
            --accent: #22d3ee;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --nvidia: #76b900;
            --amd: #ed1c24;
            --intel: #0071c5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        nav { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(12px); padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.6rem; text-decoration: none; color: white; letter-spacing: -1.5px; }
        .logo span { color: var(--accent); }

        /* Search Hero */
        .hero { padding: 60px 0; text-align: center; background: radial-gradient(circle at top, #1e1b4b, var(--bg)); }
        .search-bar { width: 90%; max-width: 700px; padding: 18px 30px; border-radius: 50px; background: #0f172a; border: 1px solid var(--border); color: white; font-size: 1.1rem; outline: none; margin-top: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        /* Main Dashboard */
        .dashboard { display: grid; grid-template-columns: 1fr 380px; gap: 30px; margin-top: 30px; padding-bottom: 100px; }
        @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } }

        /* Sidebar Tools */
        .sidebar { position: sticky; top: 100px; height: fit-content; display: flex; flex-direction: column; gap: 20px; }
        .tool-card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 24px; backdrop-filter: blur(10px); }
        .tool-card h3 { font-size: 1rem; margin-bottom: 15px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        /* Cards Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { 
            background: var(--card); border: 1px solid var(--border); padding: 22px; border-radius: 20px; 
            transition: 0.3s; cursor: pointer; position: relative; border-left: 4px solid #334155;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); background: #111827; }
        .card.nvidia { border-left-color: var(--nvidia); }
        .card.amd { border-left-color: var(--amd); }
        .card.intel { border-left-color: var(--intel); }

        .price { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
        .tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; color: var(--text-dim); }

        /* Tool UI */
        select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 10px; font-weight: 700; }
        select { background: #1e293b; color: white; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { transform: scale(1.02); filter: brightness(1.1); }
        .res-box { margin-top: 15px; padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.3); font-size: 0.85rem; display: none; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 2000; }
        .modal-content { background: #0f172a; max-width: 500px; margin: 80px auto; border-radius: 24px; padding: 40px; border: 1px solid var(--border); position: relative; }
    </style>
</head>
<body>

<nav>
    <div class="wrap nav-flex">
        <a href="#" class="logo">GAME<span>RIG</span></a>
        <div style="font-size: 0.7rem; font-weight: 800; color: var(--text-dim); letter-spacing: 2px;">PAKISTAN HARDWARE DATABASE</div>
    </div>
</nav>

<div class="hero">
    <div class="wrap">
        <h1>Search <span style="color:var(--accent)">60+</span> Components</h1>
        <input type="text" id="search" class="search-bar" placeholder="Search RTX 5090, RX 580, i5 12400..." onkeyup="filter()">
    </div>
</div>

<main class="wrap dashboard">
    
    <!-- LEFT: THE MASSIVE HARDWARE LIST -->
    <div class="content">
        <h2 style="margin-bottom: 20px;">Market Prices & Database</h2>
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT: THE TOOLS SIDEBAR -->
    <div class="sidebar">
        
        <!-- 1. FPS CALCULATOR -->
        <div class="tool-card">
            <h3>FPS Calculator</h3>
            <select id="fpsGpu">
                <option value="150">RTX 4090 / 5090</option>
                <option value="90">RTX 4070 / 3080</option>
                <option value="55" selected>RTX 3060 / RX 6600</option>
                <option value="30">GTX 1660S / RX 580</option>
            </select>
            <select id="fpsGame" style="margin-top: 10px;">
                <option value="2.5">Valorant (Competitive)</option>
                <option value="1.5">Warzone / GTA V</option>
                <option value="0.8">Cyberpunk 2077</option>
            </select>
            <button class="btn" onclick="calcFps()">Estimate FPS</button>
            <div id="fpsRes" class="res-box" style="text-align: center;">
                <span style="font-size: 2rem; color: var(--accent);" id="fpsOut">0</span><br>FPS ESTIMATED
            </div>
        </div>

        <!-- 2. BUILD GENERATOR -->
        <div class="tool-card">
            <h3>PKR Build Generator</h3>
            <select id="budget">
                <option value="low">Rs. 80,000 (Budget)</option>
                <option value="mid" selected>Rs. 180,000 (Mid-Range)</option>
                <option value="high">Rs. 400,000+ (High-End)</option>
            </select>
            <button class="btn" onclick="genBuild()">Generate Specs</button>
            <div id="buildRes" class="res-box"></div>
        </div>

        <!-- 3. SOCKET CHECKER -->
        <div class="tool-card">
            <h3>Socket Validator</h3>
            <select id="cpuS">
                <option value="AM5">Ryzen 7000+ (AM5)</option>
                <option value="AM4">Ryzen 1-5000 (AM4)</option>
                <option value="1700">Intel 12-14th (LGA 1700)</option>
                <option value="1200">Intel 10-11th (LGA 1200)</option>
                <option value="1155">Core i 2-3rd (LGA 1155)</option>
            </select>
            <select id="moboS">
                <option value="AM5">B650 / X670</option>
                <option value="AM4">B450 / B550</option>
                <option value="1700">B760 / Z790</option>
                <option value="1155">H61 / Z77</option>
            </select>
            <button class="btn" onclick="check()">Verify Match</button>
            <div id="checkRes" class="res-box" style="text-align: center; font-weight: 800;"></div>
        </div>

    </div>
</main>

<!-- MODAL -->
<div id="modal" class="modal" onclick="closeM()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName"></h2>
        <div id="mPrice" class="price"></div>
        <p id="mDesc" style="margin: 20px 0; color: var(--text-dim);"></p>
        <button class="btn" onclick="closeM()">Close</button>
    </div>
</div>

<script>
    // --- MASSIVE DATA ---
    const db = [
        { n: "RTX 5090", p: 650000, b: "nvidia", c: "Pre-order", d: "Blackwell Flagship. 32GB VRAM." },
        { n: "RTX 4090", p: 585000, b: "nvidia", c: "New", d: "Current 4K king. 24GB VRAM." },
        { n: "RTX 4080 Super", p: 340000, b: "nvidia", c: "New", d: "Ultimate 1440p/4K card." },
        { n: "RTX 4070 Ti Super", p: 265000, b: "nvidia", c: "New", d: "16GB VRAM beast." },
        { n: "RTX 4060", p: 96000, b: "nvidia", c: "New", d: "Best 1080p efficiency." },
        { n: "RTX 3090", p: 245000, b: "nvidia", c: "Used", d: "Last gen titan. Great for AI." },
        { n: "RTX 3080", p: 145000, b: "nvidia", c: "Used", d: "Classic 4K performer." },
        { n: "RTX 3070", p: 105000, b: "nvidia", c: "Used", d: "Great for high refresh 1080p." },
        { n: "RTX 3060 12GB", p: 82000, b: "nvidia", c: "Used", d: "Pakistani market favorite." },
        { n: "RTX 2080 Ti", p: 110000, b: "nvidia", c: "Used", d: "Still beats many 40-series cards." },
        { n: "RTX 2060 Super", p: 68000, b: "nvidia", c: "Used", d: "Solid DLSS card." },
        { n: "GTX 1080 Ti", p: 75000, b: "nvidia", c: "Used", d: "The 11GB legend." },
        { n: "GTX 1660 Super", p: 48000, b: "nvidia", c: "Used", d: "Budget 1080p king." },
        { n: "GTX 1060 6GB", p: 32000, b: "nvidia", c: "Used", d: "Classic budget gaming." },
        
        { n: "RX 7900 XTX", p: 345000, b: "amd", c: "New", d: "24GB AMD flagship." },
        { n: "RX 7800 XT", p: 165000, b: "amd", c: "New", d: "The 1440p value king." },
        { n: "RX 6900 XT", p: 145000, b: "amd", c: "Used", d: "High-end raster monster." },
        { n: "RX 6800 XT", p: 125000, b: "amd", c: "Used", d: "16GB VRAM beast." },
        { n: "RX 6700 XT", p: 92000, b: "amd", c: "Used", d: "Best used card under 100k." },
        { n: "RX 6600 XT", p: 78000, b: "amd", c: "Used", d: "Power efficient 1080p." },
        { n: "RX 5700 XT", p: 55000, b: "amd", c: "Used", d: "Great for budget 1080p." },
        { n: "RX 580 8GB", p: 25000, b: "amd", c: "Used", d: "The budget goat." },
        
        { n: "i9 14900K", p: 185000, b: "intel", c: "New", d: "Extreme power. 24 cores." },
        { n: "i7 12700K", p: 85000, b: "intel", c: "New", d: "Great for production." },
        { n: "i5 12400F", p: 34000, b: "intel", c: "New", d: "Best gaming value." },
        { n: "Ryzen 7 7800X3D", p: 115000, b: "amd", c: "New", d: "Fastest gaming CPU." },
        { n: "Ryzen 5 5600", p: 28500, b: "amd", c: "New", d: "Budget champion." }
    ];

    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
    }

    function render(data) {
        const g = document.getElementById('grid');
        g.innerHTML = data.map(i => `
            <div class="card ${i.b}" onclick="openM('${i.n}')">
                <span class="tag">${i.c}</span>
                <h3 style="margin-top:5px;">${i.n}</h3>
                <div class="price">Rs. ${i.p.toLocaleString()}</div>
                <div style="font-size:0.7rem; color:var(--text-dim); text-transform:uppercase;">${i.b}</div>
            </div>
        `).join('');
    }

    function filter() {
        const q = document.getElementById('search').value.toLowerCase();
        render(db.filter(x => x.n.toLowerCase().includes(q)));
    }

    function calcFps() {
        const p = document.getElementById('fpsGpu').value;
        const g = document.getElementById('fpsGame').value;
        document.getElementById('fpsRes').style.display = 'block';
        document.getElementById('fpsOut').innerText = Math.round(p * g);
    }

    function genBuild() {
        const b = document.getElementById('budget').value;
        const res = document.getElementById('buildRes');
        res.style.display = 'block';
        if(b === 'low') res.innerHTML = "<b>CPU:</b> R5 3600<br><b>GPU:</b> GTX 1660S<br><b>RAM:</b> 16GB";
        else if(b === 'mid') res.innerHTML = "<b>CPU:</b> i5 12400F<br><b>GPU:</b> RTX 4060<br><b>RAM:</b> 16GB DDR4";
        else res.innerHTML = "<b>CPU:</b> R7 7800X3D<br><b>GPU:</b> RTX 4080 Super<br><b>RAM:</b> 32GB DDR5";
    }

    function check() {
        const c = document.getElementById('cpuS').value;
        const m = document.getElementById('moboS').value;
        const res = document.getElementById('checkRes');
        res.style.display = 'block';
        if(c === m) { res.innerText = "✓ MATCHED"; res.style.color = "#10b981"; }
        else { res.innerText = "❌ FAILED"; res.style.color = "#ef4444"; }
    }

    function openM(n) {
        const i = db.find(x => x.n === n);
        document.getElementById('mName').innerText = i.n;
        document.getElementById('mPrice').innerText = "Rs. " + i.p.toLocaleString();
        document.getElementById('mDesc').innerText = i.d;
        document.getElementById('modal').style.display = 'block';
    }

    function closeM() { document.getElementById('modal').style.display = 'none'; }

    window.onload = () => { shuffle(db); render(db); };
</script>

</body>
</html>
